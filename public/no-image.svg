<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
  </defs>

  <rect width="200" height="280" fill="url(#bg)"/>

  <!-- subtle grid pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="56" x2="200" y2="56"/>
    <line x1="0" y1="112" x2="200" y2="112"/>
    <line x1="0" y1="168" x2="200" y2="168"/>
    <line x1="0" y1="224" x2="200" y2="224"/>
    <line x1="50" y1="0" x2="50" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="280"/>
    <line x1="150" y1="0" x2="150" y2="280"/>
  </g>

  <!-- image icon -->
  <g transform="translate(100, 120)" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-linejoin="round">
    <rect x="-28" y="-22" width="56" height="44" rx="4"/>
    <circle cx="-12" cy="-8" r="7" stroke="rgba(255,255,255,0.18)"/>
    <polyline points="-28,10 -8,-4 8,10 20,2 28,10"/>
  </g>

  <!-- label -->
  <text x="100" y="165" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="2">IMAGE NON DISPONIBLE</text>
</svg>
